<!DOCTYPE html>
<html>
<head>
<title>Verify Stamp University</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    margin:0;
    background:#F9FAFB;
}

.sidebar {
    width:220px;
    background:#111111;
    color:white;
    height:100vh;
    position:fixed;
    padding:30px;
}

.sidebar h2 {
    color:white;
}

.sidebar a {
    display:block;
    color:white;
    text-decoration:none;
    margin-top:20px;
}

.main {
    margin-left:240px;
    padding:40px;
}

.card {
    background:white;
    padding:30px;
    border-radius:8px;
    margin-bottom:30px;
}

button {
    padding:10px 18px;
    background:black;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Verify Stamp</h2>
    <a href="#">Dashboard</a>
    <a href="#">Issue Credential</a>
    <a href="#">Verification Logs</a>
    <a href="#">Settings</a>
</div>

<div class="main">
    <h1 id="institutionName">Dashboard</h1>

    <div class="card">
        <h3>Total Credentials Issued</h3>
        <p>128</p>
    </div>

    <div class="card">
        <h3>Recent Verification Requests</h3>
        <p>5 new requests in the last 24 hours</p>
    </div>

    <button onclick="window.location.href='issue.html'">Issue New Credential</button>
</div>
<script>
// Set Institution Name
let institution = localStorage.getItem("institutionName");

if (!institution) {
    institution = "Verify Stamp University";
    localStorage.setItem("institutionName", institution);
}

document.getElementById("institutionName").innerText = institution + " Dashboard";

// Update Credential Count
let credentials = JSON.parse(localStorage.getItem("credentials")) || [];
document.querySelector(".card p").innerText = credentials.length;
</script></body>
</html>
