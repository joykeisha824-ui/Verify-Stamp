<!DOCTYPE html>
<html>
<head>
<title>Verify Stamp University</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    margin:0;
    background:#F9FAFB;
}

.sidebar {
    width:220px;
    background:#111111;
    color:white;
    height:100vh;
    position:fixed;
    padding:30px;
}

.sidebar h2 {
    color:white;
}

.sidebar a {
    display:block;
    color:white;
    text-decoration:none;
    margin-top:20px;
}

.main {
    margin-left:240px;
    padding:40px;
}

.card {
    background:white;
    padding:30px;
    border-radius:8px;
    margin-bottom:30px;
}

button {
    padding:10px 18px;
    background:black;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
</head>
<script>
// Set Institution Name
let institution = localStorage.getItem("institutionName");
if (!institution) {
    institution = "Verify Stamp University";
    localStorage.setItem("institutionName", institution);
}
document.getElementById("institutionName").innerText = institution + " Dashboard";

// Load credentials
let credentials = JSON.parse(localStorage.getItem("credentials")) || [];

// Update dashboard counts
document.getElementById("credentialCount").innerText = credentials.length;

// Count unique students
let students = [...new Set(credentials.map(c => c.name))];
document.getElementById("studentCount").innerText = students.length;

// Verification requests (simulated)
document.getElementById("verificationCount").innerText = Math.floor(Math.random()*10);

// Populate activity table
let tbody = document.getElementById("activityTable").querySelector("tbody");
tbody.innerHTML = "";
credentials.slice(-5).reverse().forEach(c => {
    let tr = document.createElement("tr");
    tr.innerHTML = `<td>${c.id}</td><td>${c.name}</td><td>${c.degree}</td><td>${c.issuedDate}</td><td class="status-verified">Verified</td>`;
    tbody.appendChild(tr);
});
</script>
<body>

<div class="sidebar">
    <h2>Verify Stamp</h2>
    <a href="#">Dashboard</a>
    <a href="#">Issue Credential</a>
    <a href="#">Verification Logs</a>
    <a href="#">Settings</a>
</div>

<div class="main">
   <div class="main">
    <h1 id="institutionName">Dashboard</h1>

    <div class="card-container">
        <div class="card">
            <h4>Total Credentials Issued</h4>
            <h1 id="credentialCount">0</h1>
        </div>
        <div class="card">
            <h4>Active Students</h4>
            <h1 id="studentCount">0</h1>
        </div>
        <div class="card">
            <h4>Verification Requests</h4>
            <h1 id="verificationCount">0</h1>
        </div>
    </div>

    <h2>Recent Activity</h2>
    <table id="activityTable">
        <thead>
            <tr>
                <th>Credential ID</th>
                <th>Student</th>
                <th>Degree</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows inserted by JS -->
        </tbody>
    </table>

    <br>
    <button onclick="window.location.href='issue.html'">Issue New Credential</button>
</div>
