<!DOCTYPE html>
<html>
<head>
<title>Institution Login - Verify Stamp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    background:#F5F5F5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.login-box {
    background:white;
    padding:50px;
    border-radius:8px;
    width:400px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}
input {
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #E5E7EB;
    border-radius:6px;
}
button {
    width:100%;
    padding:12px;
    background:black;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Institution Sign In</h2>
    <input type="email" placeholder="Institution Email">
    <input type="password" placeholder="Password">
    <button onclick="window.location.href='dashboard.html'">Sign In</button>
</div>
<!-- Firebase App -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // YOUR CONFIG — replace with your own values from Firebase
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login function
  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Login successful
        console.log("Logged in:", userCredential.user.email);
        window.location.href = "dashboard.html"; // redirect to dashboard
      })
      .catch((error) => {
        alert("Login failed: " + error.message);
      });
  }
</script>
</body>
</html>
