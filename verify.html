<script>
function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

const id = getQueryParam("id");
let credentials = JSON.parse(localStorage.getItem("credentials")) || [];
let logs = JSON.parse(localStorage.getItem("verificationLogs")) || [];

const found = credentials.find(c => c.id === id);

if(found){

    // Add verification log
    logs.push({
        id: found.id,
        name: found.name,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("verificationLogs", JSON.stringify(logs));

    document.getElementById("result").innerHTML = `
        <p class="valid">✔ Credential Verified</p>
        <p><strong>Name:</strong> ${found.name}</p>
        <p><strong>Credential:</strong> ${found.title}</p>
        <p><strong>Issued:</strong> ${found.date}</p>
        <p><strong>ID:</strong> ${found.id}</p>
    `;
} else {
    document.getElementById("result").innerHTML = `
        <p class="invalid">✘ Credential Not Found</p>
    `;
}
</script>
