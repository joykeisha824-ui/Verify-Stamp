<!DOCTYPE html>
<html>
<head>
<title>Issue Credential - Verify Stamp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    background:#F9FAFB;
    margin:0;
}
.container {
    padding:60px 10%;
}
input {
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #E5E7EB;
    border-radius:6px;
}
button {
    padding:12px 20px;
    background:black;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
    <h1>Issue Credential</h1>

    <input type="text" id="studentName" placeholder="Student Name">
    <input type="text" id="credentialTitle" placeholder="Credential Title">
    <input type="date" id="issueDate">

    <button onclick="issueCredential()">Issue Credential</button>
</div>

<script>
function issueCredential() {
    const name = document.getElementById("studentName").value;
    const title = document.getElementById("credentialTitle").value;
    const date = document.getElementById("issueDate").value;

    const credentialID = "VS-" + Math.floor(Math.random()*100000);

    const credential = {
        id: credentialID,
        name: name,
        title: title,
        date: date
    };

    let credentials = JSON.parse(localStorage.getItem("credentials")) || [];
    credentials.push(credential);
    localStorage.setItem("credentials", JSON.stringify(credentials));

    alert("Credential Issued! ID: " + credentialID);
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
