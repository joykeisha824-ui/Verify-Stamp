<!DOCTYPE html>
<html>
<head>
<title>Issue Credential - Verify Stamp University</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; margin:0; background:#F9FAFB; }
.sidebar { width:220px; background:#111111; color:white; height:100vh; position:fixed; padding:30px; }
.sidebar h2 { margin-top:0; }
.sidebar a { display:block; color:white; text-decoration:none; margin-top:20px; font-size:14px; }
.main { margin-left:240px; padding:40px; }
.card { background:white; padding:30px; border-radius:8px; margin-bottom:30px; box-shadow:0 5px 15px rgba(0,0,0,0.04); }
button { padding:12px 20px; background:black; color:white; border:none; border-radius:6px; cursor:pointer; margin-top:15px; }
input, select { padding:10px; width:100%; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; }
h1,h3 { margin-top:0; }
</style>
</head>
<body>

<div class="sidebar">
    <h2>Verify Stamp</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="issue.html">Issue Credential</a>
    <a href="#">Verification Logs</a>
    <a href="#">Settings</a>
</div>

<div class="main">
    <h1>Issue New Credential</h1>

    <div class="card">
        <h3>Credential Information</h3>
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="text" id="degreeTitle" placeholder="Degree / Title">
        <input type="text" id="credentialId" placeholder="Credential ID (auto optional)">
        <button onclick="issueCredential()">Issue Credential</button>
    </div>

    <div class="card">
        <h3>Preview</h3>
        <div id="preview"></div>
    </div>
</div>

<script>
// Auto-generate credential ID if empty
function generateId() {
    return 'VSU-' + Math.floor(1000 + Math.random()*9000);
}

// Preview the credential
function updatePreview() {
    let name = document.getElementById("studentName").value;
    let title = document.getElementById("degreeTitle").value;
    let id = document.getElementById("credentialId").value || generateId();

    document.getElementById("preview").innerHTML = `
        <strong>${name}</strong><br>
        ${title}<br>
        <small>ID: ${id}</small>
    `;
}

// Issue the credential
function issueCredential() {
    let name = document.getElementById("studentName").value;
    let title = document.getElementById("degreeTitle").value;
    let id = document.getElementById("credentialId").value || generateId();

    if (!name || !title) {
        alert("Please enter name and title");
        return;
    }

    // Save credential to localStorage
    let credentials = JSON.parse(localStorage.getItem("credentials")) || [];
    credentials.push({name:name, title:title, id:id, issuedDate:new Date().toLocaleDateString()});
    localStorage.setItem("credentials", JSON.stringify(credentials));

    // Add to verification log
    let logs = JSON.parse(localStorage.getItem("verificationLogs")) || [];
    logs.push({name:name, time:new Date().toLocaleString()});
    localStorage.setItem("verificationLogs", JSON.stringify(logs));

    alert("Credential issued successfully!");
    // Clear fields
    document.getElementById("studentName").value = "";
    document.getElementById("degreeTitle").value = "";
    document.getElementById("credentialId").value = "";

    updatePreview();
}

document.getElementById("studentName").addEventListener("input", updatePreview);
document.getElementById("degreeTitle").addEventListener("input", updatePreview);
document.getElementById("credentialId").addEventListener("input", updatePreview);

updatePreview();
</script>

</body>
</html>
