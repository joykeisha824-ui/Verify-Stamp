<!DOCTYPE html>
<html>
<head>
<title>Issue Credential - Verify Stamp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>Verify Stamp</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="issue.html">Issue Credential</a>
</div>

<div class="main">
    <h1>Issue New Credential</h1>

    <div class="card">
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="text" id="degreeTitle" placeholder="Degree / Title">
        <input type="text" id="credentialId" placeholder="Credential ID (optional)">
        <button onclick="issueCredential()">Issue Credential</button>
    </div>
</div>

<script>
function generateId() { return 'VSU-' + Math.floor(1000+Math.random()*9000); }

function issueCredential() {
    let name = document.getElementById("studentName").value.trim();
    let title = document.getElementById("degreeTitle").value.trim();
    let id = document.getElementById("credentialId").value.trim() || generateId();

    if (!name || !title) { alert("Enter name and title"); return; }

    // Save credential
    let credentials = JSON.parse(localStorage.getItem("credentials")) || [];
    credentials.push({name:name, title:title, id:id, issuedDate:new Date().toLocaleDateString()});
    localStorage.setItem("credentials", JSON.stringify(credentials));

    // Save verification log
    let logs = JSON.parse(localStorage.getItem("verificationLogs")) || [];
    logs.push({name:name, time:new Date().toLocaleString()});
    localStorage.setItem("verificationLogs", JSON.stringify(logs));

    alert("Credential issued!");
    document.getElementById("studentName").value = "";
    document.getElementById("degreeTitle").value = "";
    document.getElementById("credentialId").value = "";
}
</script>

</body>
</html>
