<div class="main">
    <h1>Issue Credential</h1>

    <div class="card">
        <label>Student Name</label><br><br>
        <input type="text" id="studentName" placeholder="Enter student name"><br><br>

        <label>Degree / Credential</label><br><br>
        <input type="text" id="degree" placeholder="Enter credential type"><br><br>

        <button onclick="issueCredential()">Issue Credential</button>
    </div>
</div>

</body>
</html>
<script>
function issueCredential() {

    let studentName = document.getElementById("studentName").value;
    let degree = document.getElementById("degree").value;

    if (!studentName || !degree) {
        alert("Please fill out all fields.");
        return;
    }

    let credentials = JSON.parse(localStorage.getItem("credentials")) || [];

    let newCredential = {
        id: "VSU-" + Date.now(),
        name: studentName,
        degree: degree,
        issuedDate: new Date().toLocaleDateString()
    };

    credentials.push(newCredential);

    localStorage.setItem("credentials", JSON.stringify(credentials));

    alert("Credential Issued Successfully!");

    window.location.href = "institutions.html";
}
</script>
