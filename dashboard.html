<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Stamp Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f4f4f4;
}

/* NAVBAR */

.navbar{
background:#000;
color:#fff;
padding:20px 40px;
font-size:20px;
font-weight:bold;
}

/* DASHBOARD */

.container{
padding:40px;
}

h2{
margin-bottom:20px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:8px;
overflow:hidden;
}

th{
background:#111;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f9f9f9;
}

</style>

</head>

<body>

<div class="navbar">
✔ Verify Stamp Dashboard
</div>

<div class="container">

<h2>Issued Credentials</h2>

<table>

<thead>
<tr>
<th>Student</th>
<th>Degree</th>
<th>Institution</th>
<th>Date Issued</th>
</tr>
</thead>

<tbody id="credentialTable">
</tbody>

</table>

</div>

<script>

/* SUPABASE CONNECTION */

const supabaseUrl = "YOUR_SUPABASE_URL"
const supabaseKey = "YOUR_PUBLIC_ANON_KEY"

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

/* LOAD DATA */

async function loadCredentials(){

const { data, error } = await supabaseClient
.from("credentials")
.select("*")

if(error){
console.log("Error:", error)
return
}

const table = document.getElementById("credentialTable")

table.innerHTML = ""

data.forEach(row => {

table.innerHTML += `
<tr>
<td>${row.student_name}</td>
<td>${row.Degree}</td>
<td>${row.institution}</td>
<td>${new Date(row.created_at).toLocaleDateString()}</td>
</tr>
`

})

}

loadCredentials()

</script>

</body>
</html>
